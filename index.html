<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הזיכרון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #ffb6d9;
    --pink-deep: #ff6fa3;
    --purple: #c8a2ff;
    --purple-deep: #8e5cf0;
    --gold: #ffd86b;
    --gold-deep: #e6a800;
    --green: #5cb85c;
    --green-deep: #3a8a3a;
    --teal: #4ec0a8;
    --teal-deep: #2a8a78;
    --bg1: #ffe9f3;
    --bg2: #f3e0ff;
    --bg3: #fff7d6;
    --shadow: 0 8px 24px rgba(155, 81, 161, 0.25);
    --accent-1: var(--pink-deep);
    --accent-2: var(--purple-deep);
    --text-strong: #6b2d8a;
    --text-soft: #b07cc4;
  }

  body.theme-dinosaurs {
    --bg1: #d8f0d8;
    --bg2: #c8e8e0;
    --bg3: #f0f5b8;
    --shadow: 0 8px 24px rgba(58, 138, 58, 0.25);
    --accent-1: var(--green-deep);
    --accent-2: var(--teal-deep);
    --text-strong: #2a5a2a;
    --text-soft: #6a9a6a;
  }

  body.theme-mario {
    --bg1: #cce6ff;
    --bg2: #fff0c8;
    --bg3: #ffd6d6;
    --shadow: 0 8px 24px rgba(232, 51, 42, 0.28);
    --accent-1: #e8332a;
    --accent-2: #1a4ec8;
    --text-strong: #8a1010;
    --text-soft: #c47070;
  }

  body.theme-pawpatrol {
    --bg1: #cfe6ff;
    --bg2: #fff8d6;
    --bg3: #ffd9e0;
    --shadow: 0 8px 24px rgba(48, 96, 224, 0.28);
    --accent-1: #e8332a;
    --accent-2: #3060e0;
    --text-strong: #1a3a8a;
    --text-soft: #6b88c0;
  }

  html, body {
    height: 100%;
    font-family: "Heebo", "Rubik", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    user-select: none;
    transition: background 0.4s ease;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
    transition: background 0.4s ease;
  }
  body::before {
    background: rgba(255, 182, 217, 0.5);
    top: -200px; right: -200px;
  }
  body::after {
    background: rgba(200, 162, 255, 0.45);
    bottom: -200px; left: -200px;
  }
  body.theme-dinosaurs::before { background: rgba(92, 184, 92, 0.4); }
  body.theme-dinosaurs::after  { background: rgba(78, 192, 168, 0.4); }
  body.theme-mario::before     { background: rgba(232, 51, 42, 0.35); }
  body.theme-mario::after      { background: rgba(26, 78, 200, 0.35); }
  body.theme-pawpatrol::before { background: rgba(232, 51, 42, 0.30); }
  body.theme-pawpatrol::after  { background: rgba(48, 96, 224, 0.32); }

  .app {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: 10px 14px 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  h1 {
    font-size: clamp(20px, 3.2vw, 30px);
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    margin-bottom: 2px;
    line-height: 1.15;
  }
  .subtitle {
    color: var(--text-strong);
    opacity: 0.75;
    font-size: 12px;
    font-weight: 500;
  }

  /* Theme picker */
  .theme-picker {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 6px 0 4px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .theme-btn {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-strong);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .theme-btn:hover {
    transform: translateY(-2px);
  }
  .theme-btn.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white;
    border-color: white;
  }
  .theme-btn .emoji { font-size: 16px; }

  .hud {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 6px 0 10px;
    flex-shrink: 0;
  }
  .stat {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 5px 14px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: var(--text-strong);
    min-width: 80px;
    justify-content: center;
  }
  .stat .label {
    font-size: 10px;
    color: var(--text-soft);
    font-weight: 600;
    line-height: 1;
  }
  .stat .value {
    font-size: 17px;
    font-weight: 900;
    color: var(--accent-2);
    line-height: 1.1;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white;
    border: none;
    border-radius: 12px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
  .btn:active { transform: translateY(0); }

  /* Board: a 4x4 grid of 3:4 cards. Whole board is therefore 3:4
     (4 cols * 3 wide vs 4 rows * 4 tall = 12:16 = 3:4).
     We size the board's HEIGHT by whichever is tighter — viewport height
     or available width — and let aspect-ratio derive the width. This
     guarantees the board fills as much space as possible without
     overflowing on any screen size. */
  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: clamp(4px, 1vh, 10px);
    aspect-ratio: 3/4;
    /* Two-way cap: 72% of viewport height OR width-based limit */
    height: min(72vh, calc((100vw - 32px) * 4 / 3));
    max-height: 760px;
  }

  .card {
    perspective: 1000px;
    cursor: pointer;
    min-width: 0;
    min-height: 0;
    transition: transform 0.18s ease;
  }
  .card:not(.matched):not(.flipped):hover {
    transform: translateY(-4px) scale(1.03);
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card-back {
    background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid rgba(255,255,255,0.5);
  }
  .card-back::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px dashed rgba(255,255,255,0.45);
    border-radius: 12px;
  }
  .card-back-icon {
    width: 65%;
    height: 65%;
    color: white;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
  }
  .card-front {
    transform: rotateY(180deg);
    background: linear-gradient(180deg, #fff7fb 0%, #ffe4f2 100%);
    border: 3px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }
  body.theme-dinosaurs .card-front {
    background: linear-gradient(180deg, #f5fff0 0%, #d8f0c8 100%);
  }
  body.theme-mario .card-front {
    background: linear-gradient(180deg, #fffbe8 0%, #fff0c0 100%);
  }
  body.theme-mario .modal {
    background: linear-gradient(180deg, #fff 0%, #fff5d8 100%);
  }
  body.theme-mario .modal .stats-row .stat { background: #ffe8d0; }
  body.theme-mario .overlay { background: rgba(140, 30, 20, 0.55); }

  body.theme-pawpatrol .card-front {
    background: linear-gradient(180deg, #f0f7ff 0%, #d8e8ff 100%);
  }
  body.theme-pawpatrol .modal {
    background: linear-gradient(180deg, #fff 0%, #e8f0ff 100%);
  }
  body.theme-pawpatrol .modal .stats-row .stat { background: #d8e8ff; }
  body.theme-pawpatrol .overlay { background: rgba(20, 50, 130, 0.55); }
  .card-front svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card.matched .card-front {
    background: linear-gradient(180deg, #fff8d6 0%, #ffe9b0 100%);
    border-color: var(--gold);
    animation: matched-pulse 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 28px rgba(255,216,107,0.85), 0 0 0 4px rgba(255, 216, 107, 0.4);
  }
  .card.matched {
    animation: matched-glow 1.6s ease-in-out infinite;
  }
  @keyframes matched-pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.10) rotate(-3deg); }
    70% { transform: scale(1.04) rotate(2deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes matched-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.08); }
  }

  /* Win overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(75, 30, 110, 0.55);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    animation: fadein 0.4s ease;
  }
  body.theme-dinosaurs .overlay {
    background: rgba(40, 90, 50, 0.55);
  }
  .overlay.show { display: flex; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(180deg, #fff 0%, #fff5fa 100%);
    border-radius: 28px;
    padding: 32px 28px 28px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.6) inset;
    animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  body.theme-dinosaurs .modal {
    background: linear-gradient(180deg, #fff 0%, #f0fae0 100%);
  }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 {
    font-size: 36px;
    font-family: "Fredoka", "Heebo", sans-serif;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .modal .crown {
    font-size: 60px;
    margin-bottom: 8px;
    display: inline-block;
    animation: trophy-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both, trophy-bob 2.5s ease-in-out infinite 0.7s;
  }
  @keyframes trophy-pop {
    from { transform: scale(0) rotate(-180deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes trophy-bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }

  /* Star rating */
  .stars {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 14px 0 10px;
  }
  .star-icon {
    width: 38px;
    height: 38px;
    display: inline-block;
    opacity: 0.25;
    transform: scale(0.85);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .star-icon.filled {
    opacity: 1;
    transform: scale(1);
    filter: drop-shadow(0 2px 6px rgba(255, 184, 0, 0.6));
  }
  .star-icon.filled:nth-child(1) { transition-delay: 0.4s; }
  .star-icon.filled:nth-child(2) { transition-delay: 0.7s; }
  .star-icon.filled:nth-child(3) { transition-delay: 1.0s; }
  .star-icon svg { width: 100%; height: 100%; }

  .new-best-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffd700, #ff9800);
    color: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 8px;
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
    animation: new-best-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s both;
  }
  .new-best-badge:not(.show) { display: none; }
  @keyframes new-best-in {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn.secondary {
    background: white;
    color: var(--text-strong);
    border: 2px solid var(--accent-2);
  }
  .btn.secondary:hover {
    background: var(--bg2);
  }
  .modal p { color: var(--text-strong); margin-bottom: 8px; font-size: 16px; }
  .modal .stats-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 16px 0 22px;
  }
  .modal .stats-row .stat { background: #fde8f3; }
  body.theme-dinosaurs .modal .stats-row .stat { background: #e0f2d8; }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 10px; height: 14px;
    top: -20px;
    z-index: 49;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  /* ======== LANDING / MAIN MENU ======== */
  .landing {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: linear-gradient(135deg, #ffe9f3 0%, #f3e0ff 35%, #cce6ff 70%, #d8f0d8 100%);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  /* Twinkling sparkle background */
  .landing::before, .landing::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,0.9) 0, transparent 2px),
      radial-gradient(circle at 25% 75%, rgba(255,255,255,0.85) 0, transparent 2.5px),
      radial-gradient(circle at 48% 12%, rgba(255,255,255,0.8) 0, transparent 2px),
      radial-gradient(circle at 65% 38%, rgba(255,255,255,0.9) 0, transparent 2.5px),
      radial-gradient(circle at 82% 85%, rgba(255,255,255,0.85) 0, transparent 2px),
      radial-gradient(circle at 92% 25%, rgba(255,255,255,0.9) 0, transparent 3px),
      radial-gradient(circle at 8% 92%, rgba(255,255,255,0.8) 0, transparent 2px),
      radial-gradient(circle at 38% 88%, rgba(255,255,255,0.9) 0, transparent 2.5px);
    background-size: 100% 100%;
    animation: twinkle 4s ease-in-out infinite;
  }
  .landing::after {
    background-image:
      radial-gradient(circle at 30% 30%, rgba(255,215,107,0.6) 0, transparent 3px),
      radial-gradient(circle at 70% 60%, rgba(200,162,255,0.6) 0, transparent 3px),
      radial-gradient(circle at 50% 80%, rgba(255,180,210,0.6) 0, transparent 3px),
      radial-gradient(circle at 85% 15%, rgba(140,200,255,0.6) 0, transparent 3px);
    animation: twinkle 5s ease-in-out infinite reverse;
    animation-delay: 1.5s;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .landing.hidden {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }
  .landing-title {
    font-size: clamp(32px, 6vw, 56px);
    font-family: "Fredoka", "Heebo", sans-serif;
    font-weight: 700;
    background: linear-gradient(90deg, #ff6fa3, #8e5cf0, #3060e0, #5cb85c);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: -1px;
    animation: gradient-shift 6s ease-in-out infinite, title-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 4px 12px rgba(142, 92, 240, 0.25));
  }
  @keyframes gradient-shift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes title-in {
    from { opacity: 0; transform: translateY(-30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .landing-subtitle {
    color: #6b2d8a;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 600;
    margin-bottom: 28px;
    text-align: center;
    position: relative;
    z-index: 2;
    animation: title-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 720px;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 880px) {
    .menu-grid { grid-template-columns: repeat(4, 1fr); max-width: 1100px; }
  }
  @media (max-height: 600px) and (max-width: 879px) {
    .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .landing-title { font-size: 22px; margin-bottom: 2px; }
    .landing-subtitle { font-size: 12px; margin-bottom: 10px; }
  }
  .theme-card-menu {
    background: white;
    border: 4px solid white;
    border-radius: 24px;
    padding: 16px 14px 14px;
    cursor: pointer;
    box-shadow:
      0 4px 12px rgba(80, 40, 120, 0.08),
      0 14px 32px rgba(80, 40, 120, 0.18);
    transition:
      transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.35s ease,
      border-color 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    animation: card-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .theme-card-menu:nth-child(1) { animation-delay: 0.15s; }
  .theme-card-menu:nth-child(2) { animation-delay: 0.25s; }
  .theme-card-menu:nth-child(3) { animation-delay: 0.35s; }
  .theme-card-menu:nth-child(4) { animation-delay: 0.45s; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .theme-card-menu::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--card-bg, linear-gradient(135deg, #ffe9f3, #f3e0ff));
    opacity: 0.55;
    z-index: 0;
  }
  /* Glow on hover */
  .theme-card-menu::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    background: var(--card-cta-bg, linear-gradient(135deg, #ff6fa3, #8e5cf0));
    opacity: 0;
    z-index: -1;
    filter: blur(18px);
    transition: opacity 0.35s ease;
  }
  .theme-card-menu > * { position: relative; z-index: 1; }
  .theme-card-menu:hover {
    transform: translateY(-10px) scale(1.04);
    box-shadow:
      0 6px 18px rgba(80, 40, 120, 0.10),
      0 22px 48px rgba(80, 40, 120, 0.30);
    border-color: var(--card-border, #ff6fa3);
  }
  .theme-card-menu:hover::after { opacity: 0.55; }
  .theme-card-menu:hover .theme-card-previews svg { transform: translateY(-3px); }
  .theme-card-menu:hover .theme-card-emoji { animation: bounce-emoji 0.7s ease infinite; }
  @keyframes bounce-emoji {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }
  .theme-card-menu:active {
    transform: translateY(-4px) scale(1.01);
    transition-duration: 0.1s;
  }
  .theme-card-emoji {
    font-size: 36px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    transform-origin: center;
  }
  .theme-card-name {
    font-size: clamp(15px, 1.7vw, 20px);
    font-family: "Fredoka", "Heebo", sans-serif;
    font-weight: 700;
    color: var(--card-text, #6b2d8a);
    text-align: center;
    letter-spacing: -0.3px;
  }
  .theme-card-best {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    color: var(--card-text, #6b2d8a);
    font-size: 10px;
    font-weight: 800;

    border-radius: 999px;

  .theme-card-best.show { display: inline-flex; }
  .theme-card-best .star { color: #ffb800; font-size: 11px; }
  .theme-card-previews {
    display: flex;
    gap: 4px;
    width: 100%;
    justify-content: center;
    align-items: end;
  }
  .theme-card-previews svg {
    width: 33%;
    height: auto;
    max-height: 130px;
    border-radius: 12px;
    background: rgba(255,255,255,0.7);
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .theme-card-previews svg:nth-child(2) { transition-delay: 0.05s; }
  .theme-card-previews svg:nth-child(3) { transition-delay: 0.1s; }
  .theme-card-cta {
    background: var(--card-cta-bg, linear-gradient(135deg, #ff6fa3, #8e5cf0));
    color: white;
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 800;
    font-family: "Fredoka", "Heebo", sans-serif;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    transition: transform 0.2s ease;
  }
  .theme-card-menu:hover .theme-card-cta {
    transform: scale(1.06);
  }
  /* Theme card color variants */
  .theme-card-menu.t-princesses { --card-bg: linear-gradient(135deg,#ffe9f3,#f3e0ff); --card-border:#ff6fa3; --card-text:#6b2d8a; --card-cta-bg: linear-gradient(135deg,#ff6fa3,#8e5cf0); }
  .theme-card-menu.t-dinosaurs  { --card-bg: linear-gradient(135deg,#d8f0d8,#c8e8e0); --card-border:#3a8a3a; --card-text:#2a5a2a; --card-cta-bg: linear-gradient(135deg,#3a8a3a,#2a8a78); }
  .theme-card-menu.t-mario      { --card-bg: linear-gradient(135deg,#cce6ff,#fff0c8); --card-border:#e8332a; --card-text:#8a1010; --card-cta-bg: linear-gradient(135deg,#e8332a,#1a4ec8); }
  .theme-card-menu.t-pawpatrol  { --card-bg: linear-gradient(135deg,#cfe6ff,#fff8d6); --card-border:#3060e0; --card-text:#1a3a8a; --card-cta-bg: linear-gradient(135deg,#3060e0,#e8332a); }

  /* Home button (back to menu) */
  .home-btn {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 999px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 6px;
  }
  .home-btn:hover { transform: translateY(-2px) scale(1.05); }

  /* When viewport is very short, shrink even further */
  @media (max-height: 640px) {
    .subtitle { display: none; }
    h1 { font-size: 18px; }
    .app { padding: 6px 10px 8px; }
    .theme-picker { margin: 4px 0 2px; }
    .hud { margin: 4px 0 6px; }
    .stat { padding: 3px 10px; min-width: 70px; }
    .stat .value { font-size: 14px; }
    .btn { padding: 6px 14px; font-size: 12px; }
  }
</style>
</head>
<body>
<!-- Landing / main menu -->
<div class="landing" id="landing">

  <div class="menu-grid" id="menuGrid"></div>
</div>

<div class="app">
  <header>

    <div class="subtitle">מצאי את כל הזוגות במספר המהלכים הקטן ביותר</div>
  </header>

  <div class="theme-picker" id="themePicker">

  <div class="board-wrap">

  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="crown" id="winEmoji">👑</div>
    <h2>כל הכבוד!</h2>
    <p id="winMessage">השלמת את משחק הזיכרון</p>
    <div class="stars" id="starsRow">
      <div class="star-icon" data-i="0"><svg viewBox="0 0 50 50"><polygon points="25,3 31,18 47,18 34,29 38,46 25,36 12,46 16,29 3,18 19,18" fill="#ffb800" stroke="#a87830" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="star-icon" data-i="1"><svg viewBox="0 0 50 50"><polygon points="25,3 31,18 47,18 34,29 38,46 25,36 12,46 16,29 3,18 19,18" fill="#ffb800" stroke="#a87830" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="star-icon" data-i="2"><svg viewBox="0 0 50 50"><polygon points="25,3 31,18 47,18 34,29 38,46 25,36 12,46 16,29 3,18 19,18" fill="#ffb800" stroke="#a87830" stroke-width="2" stroke-linejoin="round"/></svg></div>

  </div>
</div>

<script>
// ==========================================================
// PRINCESS SVG FACTORY
// ==========================================================
function makePrincess({skin, hair, hairStyle, dress, dressAccent, crown, gem, name, cheek}) {
  let hairBack = "", hairFront = "", hairExtra = "";

  if (hairStyle === "long") {
    hairBack = `<path d="M40 90 Q30 130 35 200 L75 200 Q70 140 80 100 Z" fill="${hair}"/>
                <path d="M160 90 Q170 130 165 200 L125 200 Q130 140 120 100 Z" fill="${hair}"/>`;
    hairFront = `<path d="M55 75 Q100 50 145 75 Q145 90 130 92 Q115 80 100 80 Q85 80 70 92 Q55 90 55 75 Z" fill="${hair}"/>`;
  } else if (hairStyle === "bun") {
    hairBack = `<circle cx="100" cy="42" r="22" fill="${hair}"/>
                <circle cx="100" cy="42" r="22" fill="none" stroke="${dressAccent}" stroke-width="2" stroke-dasharray="4 3"/>`;
    hairFront = `<path d="M58 80 Q100 58 142 80 Q142 92 130 92 Q115 82 100 82 Q85 82 70 92 Q58 92 58 80 Z" fill="${hair}"/>`;
  } else if (hairStyle === "braid") {
    hairBack = `<path d="M48 95 Q42 130 50 175 Q55 195 65 200 L75 195 Q70 150 80 105 Z" fill="${hair}"/>
                <path d="M152 95 Q158 130 150 175 Q145 195 135 200 L125 195 Q130 150 120 105 Z" fill="${hair}"/>
                <ellipse cx="60" cy="135" rx="10" ry="6" fill="${hair}" opacity="0.7"/>
                <ellipse cx="60" cy="155" rx="10" ry="6" fill="${hair}" opacity="0.7"/>
                <ellipse cx="60" cy="175" rx="10" ry="6" fill="${hair}" opacity="0.7"/>`;
    hairFront = `<path d="M55 78 Q100 52 145 78 Q145 92 130 94 Q115 82 100 82 Q85 82 70 94 Q55 92 55 78 Z" fill="${hair}"/>`;
  } else if (hairStyle === "curly") {
    hairBack = `<circle cx="48" cy="95" r="14" fill="${hair}"/>
                <circle cx="42" cy="120" r="14" fill="${hair}"/>
                <circle cx="48" cy="148" r="14" fill="${hair}"/>
                <circle cx="55" cy="175" r="13" fill="${hair}"/>
                <circle cx="152" cy="95" r="14" fill="${hair}"/>
                <circle cx="158" cy="120" r="14" fill="${hair}"/>
                <circle cx="152" cy="148" r="14" fill="${hair}"/>
                <circle cx="145" cy="175" r="13" fill="${hair}"/>`;
    hairFront = `<path d="M52 78 Q100 48 148 78 Q148 92 132 94 Q115 80 100 80 Q85 80 68 94 Q52 92 52 78 Z" fill="${hair}"/>
                 <circle cx="68" cy="70" r="9" fill="${hair}"/>

  } else if (hairStyle === "ponytail") {
    hairBack = `<path d="M140 88 Q175 100 178 145 Q170 175 155 178 Q165 150 150 105 Z" fill="${hair}"/>`;

    hairExtra = `<circle cx="148" cy="95" r="8" fill="${dressAccent}"/>`;
  } else if (hairStyle === "wavy") {
    hairBack = `<path d="M42 92 Q35 130 45 165 Q40 185 55 200 Q60 185 55 170 Q50 145 60 110 Z" fill="${hair}"/>

  } else if (hairStyle === "twin") {
    hairBack = `<ellipse cx="40" cy="135" rx="14" ry="38" fill="${hair}"/>
                <ellipse cx="160" cy="135" rx="14" ry="38" fill="${hair}"/>
                <circle cx="40" cy="100" r="8" fill="${dressAccent}"/>
                <circle cx="160" cy="100" r="8" fill="${dressAccent}"/>`;
    hairFront = `<path d="M55 78 Q100 52 145 78 Q145 92 130 94 Q115 82 100 82 Q85 82 70 94 Q55 92 55 78 Z" fill="${hair}"/>`;
  }

  let crownSvg = "";
  if (crown === "tiara") {
    crownSvg = `<path d="M65 56 L80 38 L92 50 L100 32 L108 50 L120 38 L135 56 L132 62 L68 62 Z" fill="${gem}" stroke="#b8860b" stroke-width="1.5"/>
                <circle cx="100" cy="40" r="4" fill="#fff" opacity="0.9"/>
                <circle cx="80" cy="48" r="3" fill="#fff" opacity="0.7"/>
                <circle cx="120" cy="48" r="3" fill="#fff" opacity="0.7"/>`;
  } else if (crown === "classic") {
    crownSvg = `<path d="M62 58 L70 38 L82 52 L100 30 L118 52 L130 38 L138 58 L132 64 L68 64 Z" fill="${gem}" stroke="#b8860b" stroke-width="1.5"/>
                <circle cx="70" cy="38" r="3.5" fill="#ff5577"/>
                <circle cx="100" cy="30" r="4.5" fill="#3399ff"/>
                <circle cx="130" cy="38" r="3.5" fill="#22cc66"/>`;
  } else if (crown === "star") {
    crownSvg = `<path d="M65 60 L75 42 L100 28 L125 42 L135 60 L130 64 L70 64 Z" fill="${gem}" stroke="#5a3a90" stroke-width="1.5"/>
                <polygon points="100,32 103,40 112,40 105,46 108,55 100,50 92,55 95,46 88,40 97,40" fill="#fff"/>`;
  } else if (crown === "leaf") {
    crownSvg = `<path d="M62 62 Q70 40 85 50 Q92 38 100 50 Q108 38 115 50 Q130 40 138 62 Z" fill="${gem}" stroke="#3a7a3a" stroke-width="1.5"/>
                <ellipse cx="78" cy="50" rx="5" ry="8" fill="#fff" opacity="0.6"/>
                <ellipse cx="100" cy="46" rx="5" ry="8" fill="#fff" opacity="0.6"/>
                <ellipse cx="122" cy="50" rx="5" ry="8" fill="#fff" opacity="0.6"/>`;
  } else if (crown === "ice") {
    crownSvg = `<path d="M62 60 L72 36 L82 56 L92 32 L100 56 L108 32 L118 56 L128 36 L138 60 L132 64 L68 64 Z" fill="${gem}" stroke="#5a90c4" stroke-width="1.5"/>
                <circle cx="92" cy="48" r="3" fill="#fff"/>
                <circle cx="108" cy="48" r="3" fill="#fff"/>`;
  } else if (crown === "shell") {
    crownSvg = `<path d="M62 62 Q65 42 80 48 Q90 35 100 48 Q110 35 120 48 Q135 42 138 62 Z" fill="${gem}" stroke="#c4768a" stroke-width="1.5"/>
                <path d="M82 58 Q90 40 98 58 M102 58 Q110 40 118 58" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.7"/>`;
  } else if (crown === "sun") {
    crownSvg = `<circle cx="100" cy="48" r="14" fill="${gem}" stroke="#cc8800" stroke-width="1.5"/>
                <g stroke="${gem}" stroke-width="3" stroke-linecap="round">
                  <line x1="100" y1="22" x2="100" y2="32"/>
                  <line x1="78" y1="32" x2="84" y2="40"/>
                  <line x1="122" y1="32" x2="116" y2="40"/>
                  <line x1="68" y1="50" x2="78" y2="50"/>
                  <line x1="132" y1="50" x2="122" y2="50"/>
                </g>
                <circle cx="100" cy="48" r="5" fill="#fff" opacity="0.7"/>`;
  } else if (crown === "heart") {
    crownSvg = `<path d="M65 58 L80 40 L100 30 L120 40 L135 58 L132 64 L68 64 Z" fill="${gem}" stroke="#c43d6e" stroke-width="1.5"/>
                <path d="M93 42 C90 38, 84 38, 84 44 C84 50, 93 56, 100 60 C107 56, 116 50, 116 44 C116 38, 110 38, 107 42 C104 38, 96 38, 93 42 Z" fill="#fff"/>`;
  }

  return `
<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-${name}" cx="50%" cy="60%">
      <stop offset="0%" stop-color="${dressAccent}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${dressAccent}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg-${name})"/>
  <path d="M55 200 Q60 165 75 145 L125 145 Q140 165 145 200 L155 230 L45 230 Z" fill="${dress}"/>
  <path d="M75 145 L125 145 L130 175 L70 175 Z" fill="${dressAccent}" opacity="0.55"/>
  <circle cx="100" cy="160" r="4" fill="${gem}"/>
  <circle cx="85" cy="195" r="3" fill="${gem}" opacity="0.8"/>
  <circle cx="115" cy="195" r="3" fill="${gem}" opacity="0.8"/>
  <rect x="92" y="130" width="16" height="18" fill="${skin}"/>
  ${hairBack}
  <ellipse cx="100" cy="100" rx="40" ry="44" fill="${skin}"/>
  ${hairFront}
  ${hairExtra}
  <ellipse cx="85" cy="105" rx="4" ry="6" fill="#3a2a4a"/>
  <ellipse cx="115" cy="105" rx="4" ry="6" fill="#3a2a4a"/>
  <circle cx="86" cy="103" r="1.5" fill="#fff"/>
  <circle cx="116" cy="103" r="1.5" fill="#fff"/>
  <path d="M80 99 L78 96 M85 98 L84 95 M90 99 L91 96" stroke="#3a2a4a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M110 99 L109 96 M115 98 L116 95 M120 99 L122 96" stroke="#3a2a4a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M80 92 Q85 90 91 92" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M109 92 Q115 90 120 92" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="78" cy="118" rx="6" ry="4" fill="${cheek}" opacity="0.6"/>
  <ellipse cx="122" cy="118" rx="6" ry="4" fill="${cheek}" opacity="0.6"/>
  <path d="M100 110 Q98 118 100 122 Q102 118 100 110" fill="${skin}" stroke="#d4a890" stroke-width="0.8" opacity="0.6"/>
  <path d="M92 128 Q100 134 108 128" stroke="#c43d6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M93 128 Q100 132 107 128 Z" fill="#ff7a9c" opacity="0.6"/>
  ${crownSvg}
</svg>`;
}

// ==========================================================
// DINOSAUR SVGs (each one a unique character)
// ==========================================================
function dinoBg(name, color) {
  return `<defs><radialGradient id="dbg-${name}" cx="50%" cy="65%">
    <stop offset="0%" stop-color="${color}" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
  </radialGradient></defs>
  <rect width="200" height="240" fill="url(#dbg-${name})"/>
  <ellipse cx="100" cy="225" rx="75" ry="6" fill="rgba(0,0,0,0.12)"/>`;
}

function dinoFace(eyeX, eyeY) {
  return `<circle cx="${eyeX}" cy="${eyeY}" r="8" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
          <circle cx="${eyeX+1}" cy="${eyeY+1}" r="4.5" fill="#1a1a1a"/>
          <circle cx="${eyeX+2.5}" cy="${eyeY-1}" r="1.5" fill="#fff"/>`;
}

const DINOSAURS = [
  // 1. T-Rex
  { name: "trex", svg: `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">

    <path d="M80 142 Q72 145 70 152" stroke="#3a8a3a" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- head -->
    <ellipse cx="138" cy="105" rx="44" ry="38" fill="#5cb85c"/>

    <polygon points="138,121 141,131 144,121" fill="#fff"/>
    <polygon points="158,120 161,130 164,120" fill="#fff"/>
    <!-- nostril -->
    <ellipse cx="172" cy="100" rx="2.5" ry="3" fill="#2a4a2a"/>
    <!-- eye -->
    ${dinoFace(150, 90)}
    <!-- brow ridge -->
    <path d="M142 80 Q152 76 162 82" stroke="#3a8a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- back spikes -->
    <polygon points="78,128 82,118 86,128" fill="#3a8a3a"/>
    <polygon points="92,124 96,114 100,124" fill="#3a8a3a"/>
    <polygon points="106,124 110,114 114,124" fill="#3a8a3a"/>
  </svg>`},

  // 2. Triceratops
  { name: "tricera", svg: `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    ${dinoBg("tricera", "#5c9bd6")}
    <!-- tail -->
    <path d="M30 175 Q15 175 18 165 Q35 165 55 175 Z" fill="#3a6b96"/>

    <rect x="55" y="185" width="16" height="35" fill="#3a6b96" rx="3"/>

    <!-- body -->

    <!-- frill (back of head) -->
    <path d="M85 95 Q60 70 65 50 Q100 35 135 50 Q140 70 115 95 Z" fill="#7badd9"/>

    <!-- frill spikes -->
    <polygon points="65,52 68,40 75,50" fill="#3a6b96"/>
    <polygon points="95,40 98,28 105,40" fill="#3a6b96"/>
    <polygon points="125,52 128,40 135,50" fill="#3a6b96"/>
    <!-- head -->
    <ellipse cx="100" cy="115" rx="38" ry="32" fill="#5c9bd6"/>
    <!-- horn (top left) -->
    <path d="M80 92 Q76 70 82 60 Q88 80 88 96 Z" fill="#e8d4a0" stroke="#8a6a3a" stroke-width="1"/>
    <!-- horn (top right) -->
    <path d="M120 92 Q124 70 118 60 Q112 80 112 96 Z" fill="#e8d4a0" stroke="#8a6a3a" stroke-width="1"/>
    <!-- nose horn -->
    <path d="M97 132 Q95 122 100 118 Q105 122 103 132 Z" fill="#e8d4a0" stroke="#8a6a3a" stroke-width="1"/>
    <!-- beak -->
    <path d="M88 138 Q100 148 112 138 Q105 142 100 142 Q95 142 88 138 Z" fill="#3a6b96"/>
    <!-- eyes -->

  // 3. Stegosaurus
  { name: "stego", svg: `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    ${dinoBg("stego", "#a070d4")}

}

// ====== GAME LOGIC ======
const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const pairsEl = document.getElementById("pairs");
const timerEl = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const finalMoves = document.getElementById("finalMoves");
const finalTime = document.getElementById("finalTime");
const titleEl = document.getElementById("title");
const winMessageEl = document.getElementById("winMessage");
const winEmojiEl = document.getElementById("winEmoji");
const themePicker = document.getElementById("themePicker");

let cards = [], firstCard = null, secondCard = null, lock = false;
let moves = 0, pairs = 0;
let startTime = null, timerInterval = null;
let currentTheme = "princesses";

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
  }, 250);
}
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

function applyTheme(name) {
  currentTheme = name;
  const theme = THEMES[name];
  document.body.classList.remove("theme-princesses", "theme-dinosaurs", "theme-mario", "theme-pawpatrol");
  document.body.classList.add("theme-" + name);
  titleEl.textContent = theme.title;
  winMessageEl.textContent = theme.winMessage;
  winEmojiEl.textContent = theme.emoji;
  Array.from(themePicker.children).forEach(b => {
    if (b.dataset.theme) b.classList.toggle("active", b.dataset.theme === name);
  });
  buildBoard();
}

function buildThemePicker() {
  Object.entries(THEMES).forEach(([key, t]) => {
    const btn = document.createElement("button");
    btn.className = "theme-btn" + (key === currentTheme ? " active" : "");
    btn.dataset.theme = key;
    btn.innerHTML = `<span class="emoji">${t.emoji}</span><span>${t.label}</span>`;
    btn.addEventListener("click", () => applyTheme(key));
    themePicker.appendChild(btn);
  });
}

function buildBoard() {
  const theme = THEMES[currentTheme];
  board.innerHTML = "";
  cards = []; firstCard = secondCard = null; lock = false;
  moves = 0; pairs = 0;
  movesEl.textContent = "0";
  pairsEl.textContent = "0";
  timerEl.textContent = "0:00";
  stopTimer(); startTime = null;

  const deck = shuffle([...theme.cards, ...theme.cards].map((p,i) => ({...p, id: i})));
  deck.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.name = p.name;
    card.innerHTML = `<div class="card-inner"><div class="card-face card-back">${theme.backIcon}</div><div class="card-face card-front">${p.svg}</div></div>`;
    card.addEventListener("click", () => onFlip(card));
    board.appendChild(card);
    cards.push(card);
  });
}

function onFlip(card) {
  if (lock) return;
  if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
  if (!startTime) startTimer();
  card.classList.add("flipped");
  if (!firstCard) { firstCard = card; return; }
  secondCard = card;
  moves++;
  movesEl.textContent = moves;
  if (firstCard.dataset.name === secondCard.dataset.name) {
    setTimeout(() => {
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");
      firstCard = secondCard = null;
      pairs++;
      pairsEl.textContent = pairs;
      if (pairs === THEMES[currentTheme].cards.length) win();
    }, 350);
  } else {
    lock = true;
    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");
      firstCard = secondCard = null;
      lock = false;
    }, 900);
  }
}

// ====== STARS + BEST SCORE ======
function calcStars(moves, pairCount) {
  const ratio = moves / pairCount;
  if (ratio <= 1.6) return 3;
  if (ratio <= 2.4) return 2;
  return 1;
}
function loadBest(themeKey) {
  try { const raw = localStorage.getItem("memorygame.best." + themeKey); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function saveBest(themeKey, record) {
  try { localStorage.setItem("memorygame.best." + themeKey, JSON.stringify(record)); } catch {}
}
function showStars(n) {
  const stars = document.querySelectorAll("#starsRow .star-icon");
  stars.forEach(s => s.classList.remove("filled"));
  setTimeout(() => stars.forEach((s, i) => { if (i < n) s.classList.add("filled"); }), 200);
}

function win() {
  stopTimer();
  finalMoves.textContent = moves;
  finalTime.textContent = timerEl.textContent;
  const pairCount = THEMES[currentTheme].cards.length;
  const stars = calcStars(moves, pairCount);
  const elapsed = Math.floor((Date.now() - (startTime || Date.now())) / 1000);
  const prev = loadBest(currentTheme);
  let isNewBest = false;
  if (!prev || moves < prev.moves || (moves === prev.moves && elapsed < prev.timeSec)) {
    saveBest(currentTheme, { moves, timeSec: elapsed, stars, when: Date.now() });
    isNewBest = true;
  }
  setTimeout(() => {
    overlay.classList.add("show");
    showStars(stars);
    document.getElementById("newBestBadge").classList.toggle("show", isNewBest);
    burstConfetti();
    updateMenuBests();
  }, 500);
}

function burstConfetti() {
  const palettes = {
    princesses: ["#ff6fa3","#8e5cf0","#ffd86b","#4ec0d4","#5cb85c","#ff7a4a"],
    dinosaurs:  ["#5cb85c","#4ec0a8","#e8c850","#a070d4","#e8783a","#d65c5c"],
    mario:      ["#e8332a","#1a4ec8","#ffd700","#1a8a30","#ff7ab0","#fcd9b3"],
    pawpatrol:  ["#3060e0","#e8332a","#ff7ab8","#5cb85c","#ff8a30","#ffd700","#4ec0d4","#7aa84a"],
  };
  const palette = palettes[currentTheme] || palettes.princesses;
  for (let i = 0; i < 90; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = palette[Math.floor(Math.random()*palette.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";
    c.style.animationDelay = Math.random() * 0.5 + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

document.getElementById("restart").addEventListener("click", buildBoard);
document.getElementById("playAgain").addEventListener("click", () => {
  overlay.classList.remove("show");
  buildBoard();
});
document.getElementById("changeTheme").addEventListener("click", () => {
  overlay.classList.remove("show");
  showMenu();
});

// ====== LANDING / MAIN MENU ======
const landing = document.getElementById("landing");
const menuGrid = document.getElementById("menuGrid");
const homeBtn = document.getElementById("homeBtn");

function buildMenu() {
  menuGrid.innerHTML = "";
  Object.entries(THEMES).forEach(([key, t]) => {
    const samples = [t.cards[0], t.cards[3] || t.cards[1], t.cards[5] || t.cards[2]];
    const previewsHtml = samples.map(c => c.svg).join("");
    const card = document.createElement("div");
    card.className = "theme-card-menu t-" + key;
    card.dataset.theme = key;
    card.innerHTML = `
      <div class="theme-card-best"></div>
      <div class="theme-card-emoji">${t.emoji}</div>
      <div class="theme-card-name">${t.label}</div>
      <div class="theme-card-previews">${previewsHtml}</div>
      <div class="theme-card-cta">לשחק ▶</div>
    `;
    card.addEventListener("click", () => { hideMenu(); applyTheme(key); });
    menuGrid.appendChild(card);
  });
  updateMenuBests();
}

function updateMenuBests() {
  Object.keys(THEMES).forEach(key => {
    const el = document.querySelector(`.theme-card-menu[data-theme="${key}"] .theme-card-best`);
    if (!el) return;
    const best = loadBest(key);
    if (best) {
      const stars = "★".repeat(best.stars);
      el.innerHTML = `<span class="star">${stars}</span> ${best.moves} מהלכים`;
      el.classList.add("show");
    } else {
      el.classList.remove("show");
    }
  });
}

function showMenu() {
  stopTimer(); startTime = null;
  overlay.classList.remove("show");
  landing.classList.remove("hidden");
}
function hideMenu() { landing.classList.add("hidden"); }

homeBtn.addEventListener("click", showMenu);

// ====== INIT ======
buildThemePicker();
buildMenu();
applyTheme("princesses");
showMenu();
